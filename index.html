<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3b0718" />
  <meta name="description" content="The Code Society — a global community making technology and open source more accessible. Coming soon." />
  <title>The Code Society — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --wine:#3b0718; --wine-deep:#26030e; --wine-light:#64172f; --cream:#ead9d0; --muted:#b99da2; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body {
      min-height:100vh; display:grid; place-items:center; overflow:hidden; position:relative;
      background:radial-gradient(ellipse at 50% 38%, #571329 0%, var(--wine) 42%, var(--wine-deep) 100%);
      color:var(--cream); font-family:'DM Mono',monospace;
    }
    body:before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.16;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E"); mix-blend-mode:soft-light; }
    .frame { width:min(920px, calc(100% - 48px)); min-height: min(720px, calc(100svh - 48px)); border:1px solid rgba(234,217,208,.19); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:70px 28px; text-align:center; }
    .frame:before,.frame:after { content:""; position:absolute; width:42px; height:42px; border-color:rgba(234,217,208,.48); border-style:solid; }
    .frame:before { top:14px; left:14px; border-width:1px 0 0 1px; }
    .frame:after { right:14px; bottom:14px; border-width:0 1px 1px 0; }
    .eyebrow { font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:#d0aeb5; margin-bottom:42px; animation:rise .9s both; }
    .monogram-wrap { position:relative; margin-bottom:34px; animation:rise 1s .1s both; }
    .monogram {
      font-family:'Playfair Display',serif; font-weight:700; font-size:clamp(112px, 22vw, 220px); line-height:.9; letter-spacing:-.09em; padding-right:.09em;
      color:#4b1023;
      background:linear-gradient(145deg,#a76b79 0%,#6f2a40 19%,#26030e 43%,#8b4b5b 59%,#3a091a 78%,#b17b85 100%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
      filter:drop-shadow(1px 1px 0 rgba(255,218,222,.35)) drop-shadow(2px 3px 1px rgba(8,0,4,.8)) drop-shadow(0 13px 17px rgba(0,0,0,.28));
      user-select:none;
    }
    .monogram-wrap:after { content:""; position:absolute; inset:12% 8%; background:linear-gradient(115deg,transparent 35%,rgba(255,230,232,.14) 49%,transparent 58%); transform:translateX(-120%); animation:shine 5s 1.4s ease-in-out infinite; pointer-events:none; }
    h1 { font-family:'Playfair Display',serif; font-weight:500; font-size:clamp(28px,5vw,48px); letter-spacing:.015em; margin:0 0 15px; animation:rise .9s .2s both; }
    .description { color:var(--muted); font-size:12px; line-height:2; max-width:490px; margin:0 auto; animation:rise .9s .3s both; }
    .status { display:flex; align-items:center; gap:12px; margin-top:52px; color:#e0bfc3; font-size:9px; letter-spacing:.24em; text-transform:uppercase; animation:rise .9s .4s both; }
    .dot { width:7px; height:7px; border-radius:50%; background:#d9a0ac; box-shadow:0 0 0 4px rgba(217,160,172,.12),0 0 14px rgba(217,160,172,.8); animation:pulse 1.8s infinite; }
    .rule { width:46px; height:1px; background:linear-gradient(90deg,transparent,#a76b79,transparent); margin:28px 0 19px; }
    .footer { position:absolute; bottom:30px; left:0; right:0; color:rgba(234,217,208,.42); font-size:8px; letter-spacing:.2em; text-transform:uppercase; }
    @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 50% { opacity:.45; transform:scale(.82); } }
    @keyframes shine { 0%,65%,100% { transform:translateX(-120%); } 82% { transform:translateX(120%); } }
    @media(max-width:520px) { .frame { min-height:calc(100svh - 28px); width:calc(100% - 28px); padding:56px 20px 76px; } .eyebrow { margin-bottom:34px; } .status { margin-top:42px; } .footer { bottom:24px; font-size:7px; } }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after { animation:none!important; } }
  </style>
</head>
<body>
  <main class="frame">
    <div class="eyebrow">A global community · Built for everyone</div>
    <div class="monogram-wrap" aria-label="CS"><div class="monogram">CS</div></div>
    <h1>The Code Society</h1>
    <p class="description">A space for curious minds, builders, and open-source people.<br>We’re crafting something worth being part of.</p>
    <div class="rule"></div>
    <div class="status"><span class="dot"></span> Website under construction</div>
    <div class="footer">Think openly. Build together. Make it accessible.</div>
  </main>
</body>
</html>
