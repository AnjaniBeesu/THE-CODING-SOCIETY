<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#26070d" />
  <meta name="description" content="The Code Society — a global technology and open-source community." />
  <title>The Code Society</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body { min-height: 100vh; color: #fff; }
    .brand-header {
      min-height: 184px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 6vw, 88px);
      padding: 28px clamp(20px, 5vw, 72px);
      overflow: hidden;
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(120,43,57,.55), transparent 70%),
        linear-gradient(115deg, #3b1119, #521923 48%, #351017);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand-header:before {
      content: ""; position: absolute; inset: 0; z-index: -1; opacity: .17; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .logo-mark {
      flex: 0 0 auto;
      width: clamp(92px, 13vw, 148px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      font: 400 clamp(66px, 9vw, 112px)/.8 'Cormorant Garamond', Georgia, serif;
      letter-spacing: -.16em;
      padding-right: .16em;
      color: #4a151e;
      text-shadow: -1px -1px 1px rgba(255,190,190,.48), 1px 2px 2px rgba(0,0,0,.9), 0 5px 8px rgba(0,0,0,.4);
      filter: drop-shadow(0 1px 0 rgba(255,210,210,.12));
      transform: translateY(-2px);
      user-select: none;
    }
    .wordmark {
      color: #4a151e;
      font: 500 clamp(25px, 5.1vw, 66px)/1 'Playfair Display', Georgia, serif;
      letter-spacing: .025em;
      text-align: center;
      white-space: nowrap;
      text-shadow: -1px -1px 1px rgba(255,190,190,.5), 1px 2px 2px rgba(0,0,0,.92), 0 5px 9px rgba(0,0,0,.35);
      user-select: none;
    }
    main {
      min-height: calc(100vh - 184px);
      display: grid;
      place-items: center;
      padding: 48px 24px;
      background: #000;
    }
    .construction {
      margin: 0;
      color: #fff;
      font: 400 clamp(22px, 3.2vw, 42px)/1.2 'Playfair Display', Georgia, serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-align: center;
      animation: appear 1.1s ease both;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) {
      .brand-header { min-height: 132px; gap: 16px; padding: 20px 14px; }
      .logo-mark { width: 76px; font-size: 58px; }
      .wordmark { white-space: normal; font-size: clamp(19px, 5vw, 30px); max-width: 66vw; }
      main { min-height: calc(100vh - 132px); }
    }
    @media (prefers-reduced-motion: reduce) { .construction { animation: none; } }
  </style>
</head>
<body>
  <header class="brand-header" aria-label="The Code Society branding">
    <div class="logo-mark" aria-label="CS logo">CS</div>
    <div class="wordmark">THE CODING SOCIETY</div>
  </header>
  <main>
    <h1 class="construction">Under Construction</h1>
  </main>
</body>
</html>
